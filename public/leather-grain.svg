<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <filter id="leather" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".14 .19" numOctaves="4" seed="17" stitchTiles="stitch" result="pores"/>
    <feDiffuseLighting in="pores" surfaceScale="2.8" diffuseConstant=".8" lighting-color="#d1d1d1" result="relief"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="5" stitchTiles="stitch" result="fine"/>
    <feBlend in="relief" in2="fine" mode="multiply"/>
    <feComponentTransfer><feFuncR type="linear" slope="1.2" intercept=".16"/><feFuncG type="linear" slope="1.2" intercept=".16"/><feFuncB type="linear" slope="1.2" intercept=".16"/></feComponentTransfer>
  </filter>
  <rect width="160" height="160" fill="#808080" filter="url(#leather)"/>
</svg>
